[package]
name = "eda-cpu-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eda-core = { path = "../eda-core" }
eda-hdl = { path = "../eda-hdl" }
eda-sim = { path = "../eda-sim" }

[dev-dependencies]
# Independent RV32I instruction-set oracle used by the RTL differential tests.
raven-riscv-engine = "=0.1.1"
# Gate-level regression uses the in-tree synthesizer.
eda-synth = { path = "../eda-synth" }
# SDF back-annotation for the GL+SDF regression matrices.
eda-sdf = { path = "../eda-sdf" }

[[bin]]
name = "cpu-platform"
path = "src/main.rs"
